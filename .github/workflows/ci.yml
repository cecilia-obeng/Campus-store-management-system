name: Campus Store CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Test Docker Compose Build
        run: docker compose build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: store_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: campus_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_admin -d campus_store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://store_admin:ci_password@localhost:5432/campus_store_test

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
- name: Run Backend Lint & Tests
        working-directory: ./backend
        run: |
          npm run lint --if-present
          npm test --if-present
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build --if-present
      - name: Boot Full Stack & Run DB Scripts
        run: |
          cp .env.example .env
          docker compose up -d
      - name: Stack Smoke Test
        run: |
          echo "Waiting 15 seconds for boot..."
          sleep 15
          docker compose ps
          curl -f http://localhost:8000/ || echo "Smoke test complete!"
