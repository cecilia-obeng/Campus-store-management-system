version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: campus_store_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-store_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_store}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: 
      context: ./backend
    container_name: campus_store_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://store_admin:local_secret_password@db:5432/campus_store}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: campus_store_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
