openapi: 3.0.3
info:
  title: Campus Store Sales Tracker API
  version: 1.0.0
  description: |
    REST API for the Campus Store Sales Tracker (Team A).
    Human-readable contract: dev_docs/05-api-reference.md. This file and that
    document must change together (see dev_docs/02 §5).

    * JSON in and out, snake_case fields.
    * Money is a JSON number (2 dp). Date-times are ISO 8601 UTC.
    * Every error uses the Error schema.
  contact:
    name: Joseph (Backend)
servers:
  - url: http://localhost:8000/api
    description: Docker Compose / local backend
  - url: /api
    description: Through the frontend dev-server proxy

tags:
  - name: Health
  - name: Categories
  - name: Products
  - name: Sales
  - name: Summary

paths:
  /health:
    get:
      tags: [Health]
      summary: API and database availability
      operationId: getHealth
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, database: ok }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: error, database: unreachable }

  /categories:
    get:
      tags: [Categories]
      summary: List all categories (ordered by name)
      operationId: listCategories
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /products:
    get:
      tags: [Products]
      summary: List, search, filter, sort and paginate products
      operationId: listProducts
      parameters:
        - name: search
          in: query
          description: Name contains this text (case-insensitive)
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: category_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: low_stock
          in: query
          description: true = only products with stock_quantity <= reorder_level
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, price, -price, stock_quantity, -stock_quantity, created_at, -created_at]
            default: name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
            example: { name: Pilot Pen Blue, category_id: 6, price: 4.5, stock_quantity: 120, reorder_level: 20 }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: /api/products/{id}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Get one product
      operationId: getProduct
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Replace a product (all required fields)
      description: Changing price does not change past sales. Omitting reorder_level resets it to 10.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      summary: Delete a product that has never been sold
      operationId: deleteProduct
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sales:
    get:
      tags: [Sales]
      summary: Sales history with filters (newest first by default)
      operationId: listSales
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: product_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: category_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: payment_method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [sale_date, -sale_date, total, -total]
            default: -sale_date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sales
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sale' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Sales]
      summary: Record a sale (stock decreases in the same transaction)
      description: |
        unit_price is copied from the product by the server; any unit_price or total
        in the request is ignored. Fails with 409 INSUFFICIENT_STOCK and changes
        nothing if stock_quantity < quantity.
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCreateInput' }
            example: { product_id: 10, quantity: 2, payment_method: mobile_money }
      responses:
        '201':
          description: Recorded
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleWithStockEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sales/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sales]
      summary: Get one sale
      operationId: getSale
      responses:
        '200':
          description: The sale
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sales]
      summary: Correct a sale (stock adjusts by the quantity difference)
      description: product_id and unit_price cannot be changed.
      operationId: updateSale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleUpdateInput' }
            example: { quantity: 3 }
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleWithStockEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Sales]
      summary: Cancel a sale (deletes it and restores stock)
      operationId: deleteSale
      responses:
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /summary:
    get:
      tags: [Summary]
      summary: Dashboard KPIs
      description: Metric definitions in dev_docs/05-api-reference.md §7.2 and dev_docs/10.
      operationId: getSummary
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: KPIs for the period (all time when no dates)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Summary' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /summary/daily:
    get:
      tags: [Summary]
      summary: Revenue and orders per UTC day (FR-61)
      description: The last `days` whole UTC days, oldest first, ending today. Days without sales are included with 0. See dev_docs/05-api-reference.md §9.2.
      operationId: getDailySummary
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: One entry per day
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DailyRevenue' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      description: Inclusive start date (00:00 UTC)
      schema: { type: string, format: date, example: '2026-10-01' }
    To:
      name: to
      in: query
      description: Inclusive end date (whole day, i.e. sale_date < to + 1 day)
      schema: { type: string, format: date, example: '2026-10-31' }

  responses:
    ValidationError:
      description: VALIDATION_ERROR or INVALID_JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request body is invalid.
              details:
                - { field: price, message: Price must be 0 or more. }
    NotFound:
      description: NOT_FOUND or ROUTE_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: NOT_FOUND, message: Product 99 was not found. }
    Conflict:
      description: DUPLICATE, INSUFFICIENT_STOCK or IN_USE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            duplicate:
              value:
                error: { code: DUPLICATE, message: "A product named 'Cola 330ml' already exists." }
            insufficientStock:
              value:
                error:
                  code: INSUFFICIENT_STOCK
                  message: "Only 3 units of 'USB Flash Drive 32GB' in stock; cannot sell 5."
                  details:
                    - { field: quantity, message: Only 3 available., available: 3, requested: 5 }
            inUse:
              value:
                error: { code: IN_USE, message: Product 4 has 12 sales and cannot be deleted. }

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, error] }
        database: { type: string, enum: [ok, unreachable] }

    PaymentMethod:
      type: string
      enum: [cash, mobile_money, card]

    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 24 }

    Category:
      type: object
      required: [id, name, description, product_count]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: Electronics }
        description: { type: string, nullable: true, example: null }
        product_count: { type: integer, example: 4 }

    Product:
      type: object
      required: [id, name, category_id, category_name, price, stock_quantity, reorder_level, is_low_stock, created_at, updated_at]
      properties:
        id: { type: integer, example: 10 }
        name: { type: string, example: USB Flash Drive 32GB }
        category_id: { type: integer, example: 3 }
        category_name: { type: string, example: Electronics }
        price: { type: number, format: double, example: 75 }
        stock_quantity: { type: integer, example: 34 }
        reorder_level: { type: integer, example: 10 }
        is_low_stock:
          type: boolean
          description: stock_quantity <= reorder_level (calculated by the API)
          example: false
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, category_id, price, stock_quantity]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        category_id: { type: integer, minimum: 1 }
        price: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        stock_quantity: { type: integer, minimum: 0 }
        reorder_level: { type: integer, minimum: 0, default: 10 }

    ProductEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Product' }

    Sale:
      type: object
      required: [id, product_id, product_name, category_id, category_name, quantity, unit_price, total, payment_method, sale_date, created_at]
      properties:
        id: { type: integer, example: 201 }
        product_id: { type: integer, example: 10 }
        product_name: { type: string, example: USB Flash Drive 32GB }
        category_id: { type: integer, example: 3 }
        category_name: { type: string, example: Electronics }
        quantity: { type: integer, example: 2 }
        unit_price: { type: number, format: double, example: 75, description: Price at the time of sale }
        total: { type: number, format: double, example: 150, description: quantity × unit_price }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        sale_date: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    SaleWithStock:
      allOf:
        - $ref: '#/components/schemas/Sale'
        - type: object
          required: [product_stock_after, is_low_stock]
          properties:
            product_stock_after: { type: integer, example: 32 }
            is_low_stock: { type: boolean, example: false }

    SaleWithStockEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SaleWithStock' }

    SaleCreateInput:
      type: object
      required: [product_id, quantity, payment_method]
      properties:
        product_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        sale_date:
          type: string
          format: date-time
          description: Not in the future (5-minute tolerance). Defaults to now.

    SaleUpdateInput:
      type: object
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        sale_date: { type: string, format: date-time }

    TopProduct:
      type: object
      required: [product_id, product_name, category_name, units_sold, revenue]
      properties:
        product_id: { type: integer }
        product_name: { type: string }
        category_name: { type: string }
        units_sold: { type: integer }
        revenue: { type: number, format: double }

    Summary:
      type: object
      required: [period, total_revenue, total_orders, average_order_value, total_units_sold, low_stock_count, top_products]
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
        total_revenue: { type: number, format: double, example: 12549.5 }
        total_orders: { type: integer, example: 200 }
        average_order_value: { type: number, format: double, example: 62.75 }
        total_units_sold: { type: integer, example: 402 }
        low_stock_count: { type: integer, example: 2 }
        top_products:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/TopProduct' }

    DailyRevenue:
      type: object
      required: [date, revenue, orders]
      properties:
        date: { type: string, format: date, example: '2026-10-21' }
        revenue: { type: number, format: double, example: 261 }
        orders: { type: integer, example: 2 }

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
        available: { type: integer, description: Only on INSUFFICIENT_STOCK }
        requested: { type: integer, description: Only on INSUFFICIENT_STOCK }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, INVALID_JSON, NOT_FOUND, ROUTE_NOT_FOUND, DUPLICATE, INSUFFICIENT_STOCK, IN_USE, INTERNAL_ERROR]
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
